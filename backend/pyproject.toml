[project]
name = "covora"
version = "0.1.0"
description = "Covora: autonomous AI sales agent (hackathon MVP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "pgvector",
    "openai>=1.40",
    "httpx",
    "langgraph==1.2.16",
    "langgraph-checkpoint-postgres==3.2.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["covora"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# B008: FastAPI's Depends() in defaults is the framework's idiom.
# UP046/UP047: keep typing.Generic (works with pydantic and SQLAlchemy without PEP 695 syntax).
# RUF001-003: en dashes and arrows (5–25, →) are intentional display text.
ignore = ["B008", "UP046", "UP047", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
