services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: covora
      POSTGRES_PASSWORD: covora
      POSTGRES_DB: covora
    ports:
      - "5433:5432"
    volumes:
      - covora_pg:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covora"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  covora_pg:
